<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BidStream</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>BidStream</h1>
    <p class="tagline">AI providers bid via HTTP 402. XRPL settles the winner. Every payment carries its own justification.</p>
  </header>

  <section id="session-bar" class="panel">
    <div class="spend-row">
      <div class="spend-label">
        Session <code id="session-id">—</code>
        <span id="session-status" class="badge">active</span>
      </div>
      <div class="spend-amount">
        $<span id="spent-usd">0.000000</span> / $<span id="cap-usd">0.00</span>
      </div>
    </div>
    <div class="spend-bar"><div id="spend-fill" class="spend-fill"></div></div>
    <button id="resume-btn" hidden>Resume session</button>
  </section>

  <main>
    <section class="panel" id="task-form-panel">
      <h2>Submit a task</h2>
      <form id="task-form">
        <textarea id="prompt" placeholder="Describe the task…" required></textarea>
        <div class="form-row">
          <label>Complexity
            <select id="complexity">
              <option value="simple">simple</option>
              <option value="standard" selected>standard</option>
              <option value="complex">complex</option>
            </select>
          </label>
          <label>Budget (USD)
            <input id="budget" type="number" step="0.01" min="0.01" value="0.20" />
          </label>
          <button type="submit">Run auction</button>
        </div>
      </form>
    </section>

    <section class="panel" id="bids-panel">
      <h2>Live bids</h2>
      <div id="bid-feed" class="feed"><p class="empty">Submit a task to see providers bid.</p></div>
    </section>

    <section class="panel" id="payments-panel">
      <h2>Settlements</h2>
      <div id="payment-feed" class="feed"><p class="empty">No settlements yet.</p></div>
    </section>

    <section class="panel" id="memo-panel">
      <h2>Latest audit memo</h2>
      <pre id="memo-view">—</pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
